<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" width="480" height="360">
  <!-- 「正在建设」意境插画：书签/旗帜插在空白图版上，赭石+墨线 -->
  <!-- 图版（空白板） -->
  <rect x="110" y="120" width="260" height="150" rx="10" fill="#121C31" stroke="#5E6C85" stroke-opacity="0.7" stroke-width="2"/>
  <line x1="140" y1="232" x2="340" y2="232" stroke="#5E6C85" stroke-opacity="0.25" stroke-width="2" stroke-linecap="round" stroke-dasharray="2 8"/>
  <line x1="140" y1="248" x2="300" y2="248" stroke="#5E6C85" stroke-opacity="0.25" stroke-width="2" stroke-linecap="round" stroke-dasharray="2 8"/>
  <!-- 图版支架 -->
  <line x1="170" y1="270" x2="140" y2="330" stroke="#5E6C85" stroke-opacity="0.6" stroke-width="2" stroke-linecap="round"/>
  <line x1="310" y1="270" x2="340" y2="330" stroke="#5E6C85" stroke-opacity="0.6" stroke-width="2" stroke-linecap="round"/>
  <line x1="110" y1="330" x2="370" y2="330" stroke="#5E6C85" stroke-opacity="0.25" stroke-width="2" stroke-linecap="round"/>
  <!-- 旗杆 -->
  <line x1="240" y1="120" x2="240" y2="46" stroke="#5E6C85" stroke-opacity="0.8" stroke-width="2.5" stroke-linecap="round"/>
  <!-- 赭石旗帜 -->
  <path d="M240,46 L306,58 L240,74 Z" fill="#F5A94B" fill-opacity="0.9" stroke="#F5A94B" stroke-width="2" stroke-linejoin="round"/>
  <!-- 左侧小书签旗 -->
  <line x1="176" y1="120" x2="176" y2="78" stroke="#5E6C85" stroke-opacity="0.6" stroke-width="2" stroke-linecap="round"/>
  <path d="M176,78 L176,104 L188,98 L200,104 L200,78 Z" fill="#F5A94B" fill-opacity="0.35" stroke="#F5A94B" stroke-width="2" stroke-linejoin="round"/>
  <!-- 板面墨线稿 -->
  <line x1="140" y1="152" x2="220" y2="152" stroke="#5E6C85" stroke-opacity="0.4" stroke-width="2" stroke-linecap="round"/>
  <line x1="140" y1="172" x2="260" y2="172" stroke="#5E6C85" stroke-opacity="0.28" stroke-width="2" stroke-linecap="round"/>
  <line x1="140" y1="192" x2="240" y2="192" stroke="#5E6C85" stroke-opacity="0.28" stroke-width="2" stroke-linecap="round"/>
  <!-- 右上角小圆点装饰 -->
  <circle cx="330" cy="88" r="5" fill="none" stroke="#F5A94B" stroke-width="2"/>
  <circle cx="356" cy="66" r="3" fill="#F5A94B" fill-opacity="0.5"/>
  <circle cx="150" cy="60" r="3.5" fill="none" stroke="#5E6C85" stroke-opacity="0.35" stroke-width="2"/>
</svg>
